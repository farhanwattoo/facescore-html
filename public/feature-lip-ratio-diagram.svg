<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Lip ratio illustration</title>
  <desc id="desc">Original SVG showing mouth width, upper-to-lower lip ratio, cupid's bow, and lip corner angle.</desc>
  <rect width="720" height="480" fill="#f8fbff"/>
  <rect x="24" y="24" width="672" height="432" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g transform="translate(86 86)">
    <rect width="320" height="240" rx="22" fill="#fff8fc" stroke="#e1e8f4"/>
    <path d="M58 124c30-24 84-34 102-8c18-26 72-16 102 8c-30 36-84 54-102 54c-18 0-72-18-102-54Z" fill="#ffb3cf" stroke="#203047" stroke-width="4"/>
    <path d="M58 124c38 10 72 16 102 16s64-6 102-16" fill="none" stroke="#8c2f5a" stroke-width="4"/>
    <line x1="58" y1="124" x2="262" y2="124" stroke="#ff6ca7" stroke-width="4" stroke-dasharray="8 8"/>
    <line x1="160" y1="76" x2="160" y2="124" stroke="#94a3b8" stroke-width="4"/>
    <line x1="160" y1="124" x2="160" y2="176" stroke="#203047" stroke-width="4"/>
    <path d="M136 104c8-10 16-16 24-18c8 2 16 8 24 18" fill="none" stroke="#203047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="58" cy="124" r="6" fill="#ff6ca7"/>
    <circle cx="262" cy="124" r="6" fill="#ff6ca7"/>
    <circle cx="160" cy="124" r="6" fill="#8c2f5a"/>
    <text x="34" y="214" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#203047">Mouth width</text>
    <text x="34" y="236" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Compared with pupil or nose width references</text>
  </g>
  <g transform="translate(438 88)" font-family="Arial, sans-serif">
    <rect width="188" height="80" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="32" font-size="20" font-weight="700" fill="#203047">Upper lip</text>
    <text x="18" y="56" font-size="15" fill="#64748b">Approx. 1.0</text>
    <rect y="100" width="188" height="80" rx="16" fill="#fff" stroke="#e1e8f4"/>
    <text x="18" y="132" font-size="20" font-weight="700" fill="#203047">Lower lip</text>
    <text x="18" y="156" font-size="15" fill="#64748b">Approx. 1.6</text>
    <rect y="200" width="188" height="92" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="232" font-size="20" font-weight="700" fill="#203047">Lip corners</text>
    <text x="18" y="258" font-size="15" fill="#64748b">Slight lift reads as a smile cue</text>
  </g>
  <text x="82" y="408" font-family="Arial, sans-serif" font-size="18" fill="#64748b">The lip ratio is descriptive only. AI also tracks mouth aspect ratio, corner angle, and expression state.</text>
</svg>
