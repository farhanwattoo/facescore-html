<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Professional photo versus smartphone selfie setup comparison</title>
  <desc id="desc">Original SVG comparing studio portrait conditions with a strong smartphone selfie setup for face analysis accuracy.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">Studio portrait vs smartphone selfie</text>
    <text x="72" y="126" font-size="18" fill="#64748b">Highest score and most accurate measurement are not always the same goal.</text>
  </g>
  <g transform="translate(72 176)" font-family="Arial, sans-serif">
    <g>
      <rect width="332" height="308" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <text x="24" y="38" font-size="24" font-weight="700" fill="#203047">Professional portrait</text>
      <text x="24" y="74" font-size="16" fill="#64748b">Pros:</text>
      <text x="42" y="102" font-size="16" fill="#64748b">• controlled light</text>
      <text x="42" y="128" font-size="16" fill="#64748b">• flattering lens compression</text>
      <text x="42" y="154" font-size="16" fill="#64748b">• stable posing and distance</text>
      <text x="24" y="198" font-size="16" fill="#64748b">Watch out for:</text>
      <text x="42" y="226" font-size="16" fill="#64748b">• heavy retouching</text>
      <text x="42" y="252" font-size="16" fill="#64748b">• makeup tuned for style, not measurement</text>
      <text x="42" y="278" font-size="16" fill="#64748b">• edits that hide real skin and edges</text>
    </g>
    <g transform="translate(404 0)">
      <rect width="332" height="308" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <text x="24" y="38" font-size="24" font-weight="700" fill="#203047">Smartphone setup</text>
      <text x="24" y="74" font-size="16" fill="#64748b">Best baseline:</text>
      <text x="42" y="102" font-size="16" fill="#64748b">• rear camera + timer</text>
      <text x="42" y="128" font-size="16" fill="#64748b">• window light or soft ring light</text>
      <text x="42" y="154" font-size="16" fill="#64748b">• 60 to 80 cm distance</text>
      <text x="24" y="198" font-size="16" fill="#64748b">Strength:</text>
      <text x="42" y="226" font-size="16" fill="#64748b">• repeatable retests at home</text>
      <text x="42" y="252" font-size="16" fill="#64748b">• more natural skin and expression</text>
      <text x="42" y="278" font-size="16" fill="#64748b">• easier to compare conditions honestly</text>
    </g>
  </g>
  <text x="72" y="538" font-family="Arial, sans-serif" font-size="17" fill="#64748b">If the goal is honest retesting, a clean natural smartphone photo often beats a highly retouched studio portrait.</text>
</svg>
