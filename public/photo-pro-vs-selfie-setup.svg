<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Professional photo versus smartphone selfie setup comparison</title>
  <desc id="desc">Original SVG comparing studio portrait conditions with a strong smartphone selfie setup for face analysis accuracy.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">スタジオ写真 vs スマホ自撮り</text>
    <text x="72" y="126" font-size="18" fill="#64748b">最高スコアと最も正確な測定は、必ずしも同じゴールではありません。</text>
  </g>
  <g transform="translate(72 176)" font-family="Arial, sans-serif">
    <g>
      <rect width="332" height="308" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <text x="24" y="38" font-size="24" font-weight="700" fill="#203047">プロのポートレート</text>
      <text x="24" y="74" font-size="16" fill="#64748b">長所：</text>
      <text x="42" y="102" font-size="16" fill="#64748b">• 管理された照明</text>
      <text x="42" y="128" font-size="16" fill="#64748b">• 顔立ちを引き立てる望遠圧縮</text>
      <text x="42" y="154" font-size="16" fill="#64748b">• 安定したポーズと距離</text>
      <text x="24" y="198" font-size="16" fill="#64748b">注意点：</text>
      <text x="42" y="226" font-size="16" fill="#64748b">• 強いレタッチ</text>
      <text x="42" y="252" font-size="16" fill="#64748b">• 測定向きではない作り込んだメイク</text>
      <text x="42" y="278" font-size="16" fill="#64748b">• 実際の肌や輪郭を隠す加工</text>
    </g>
    <g transform="translate(404 0)">
      <rect width="332" height="308" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <text x="24" y="38" font-size="24" font-weight="700" fill="#203047">スマホでのセットアップ</text>
      <text x="24" y="74" font-size="16" fill="#64748b">基本の推奨設定：</text>
      <text x="42" y="102" font-size="16" fill="#64748b">• 背面カメラ＋タイマー</text>
      <text x="42" y="128" font-size="16" fill="#64748b">• 窓の光かやわらかいリングライト</text>
      <text x="42" y="154" font-size="16" fill="#64748b">• 60〜80cmの距離</text>
      <text x="24" y="198" font-size="16" fill="#64748b">強み：</text>
      <text x="42" y="226" font-size="16" fill="#64748b">• 自宅で何度でも再測定できる</text>
      <text x="42" y="252" font-size="16" fill="#64748b">• より自然な肌と表情</text>
      <text x="42" y="278" font-size="16" fill="#64748b">• 条件を正直に比較しやすい</text>
    </g>
  </g>
  <text x="72" y="538" font-family="Arial, sans-serif" font-size="17" fill="#64748b">正直な再測定が目的なら、加工の少ない自然なスマホ写真の方が、強くレタッチされたスタジオ写真より適していることが多いです。</text>
</svg>
