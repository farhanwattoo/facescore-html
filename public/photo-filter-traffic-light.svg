<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Filter recommendation traffic light</title>
  <desc id="desc">Original SVG comparing safe edits, caution edits, and not recommended filters for AI face analysis photos.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">フィルター・加工のおすすめガイド</text>
    <text x="72" y="126" font-size="18" fill="#64748b">目的はモデルを騙すことではなく、よりきれいなデータを渡すことです。</text>
  </g>
  <g transform="translate(72 182)" font-family="Arial, sans-serif">
    <g>
      <rect width="232" height="282" rx="20" fill="#f8fff9" stroke="#d8eadf"/>
      <circle cx="116" cy="58" r="26" fill="#2e7d32"/>
      <text x="116" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">OK</text>
      <text x="24" y="118" font-size="22" font-weight="700" fill="#203047">おすすめ</text>
      <text x="24" y="152" font-size="16" fill="#64748b">軽い明るさ補正</text>
      <text x="24" y="180" font-size="16" fill="#64748b">穏やかなコントラスト補正</text>
      <text x="24" y="208" font-size="16" fill="#64748b">ナチュラルメイク</text>
      <text x="24" y="236" font-size="16" fill="#64748b">離れて撮影した後の軽いトリミング</text>
    </g>
    <g transform="translate(262 0)">
      <rect width="232" height="282" rx="20" fill="#fffdf8" stroke="#ebe4d7"/>
      <circle cx="116" cy="58" r="26" fill="#d5a14a"/>
      <text x="116" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">!</text>
      <text x="24" y="118" font-size="22" font-weight="700" fill="#203047">注意して使用</text>
      <text x="24" y="152" font-size="16" fill="#64748b">弱めの美肌補正</text>
      <text x="24" y="180" font-size="16" fill="#64748b">顔の輪郭が保たれる範囲のポートレートぼかし</text>
      <text x="24" y="208" font-size="16" fill="#64748b">再測定の条件が揃うなら濃いアイライン</text>
      <text x="24" y="236" font-size="16" fill="#64748b">肌の質感が自然に見える範囲のHDR</text>
    </g>
    <g transform="translate(524 0)">
      <rect width="232" height="282" rx="20" fill="#fff9fb" stroke="#efdbe4"/>
      <circle cx="116" cy="58" r="26" fill="#c62828"/>
      <text x="116" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">NG</text>
      <text x="24" y="118" font-size="22" font-weight="700" fill="#203047">避ける</text>
      <text x="24" y="152" font-size="16" fill="#64748b">小顔・輪郭加工</text>
      <text x="24" y="180" font-size="16" fill="#64748b">動物の耳・スタンプ・キャラフィルター</text>
      <text x="24" y="208" font-size="16" fill="#64748b">過度な肌ぼかし</text>
      <text x="24" y="236" font-size="16" fill="#64748b">輪郭が消えるほどの過度な明るさ補正</text>
    </g>
  </g>
  <text x="72" y="534" font-family="Arial, sans-serif" font-size="17" fill="#64748b">輪郭加工フィルターはランドマークの比率を直接変えるため、公平性と再現性を最も損ないます。</text>
</svg>
