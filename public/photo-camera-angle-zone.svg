<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Camera angle and distance zone diagram</title>
  <desc id="desc">Original SVG showing optimal camera position slightly above eye level and at moderate distance, with poor close and side angles highlighted.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="92" font-size="34" font-weight="700" fill="#203047">Camera angle, height, and distance</text>
    <text x="72" y="126" font-size="18" fill="#64748b">Aim for slightly above eye level and enough distance to avoid wide-angle distortion.</text>
  </g>
  <g transform="translate(76 180)">
    <rect x="0" y="0" width="360" height="332" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="26" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#203047">Top-down view</text>
    <circle cx="160" cy="174" r="46" fill="#fff" stroke="#203047" stroke-width="4"/>
    <rect x="148" y="160" width="24" height="24" rx="6" fill="#ff6ca7"/>
    <circle cx="160" cy="66" r="48" fill="#e8f7ff" stroke="#6db7d6" stroke-width="4"/>
    <text x="160" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#203047">Best zone</text>
    <circle cx="68" cy="120" r="42" fill="#fff4df" stroke="#d5a14a" stroke-width="4"/>
    <text x="68" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Too close</text>
    <circle cx="258" cy="130" r="42" fill="#fff4df" stroke="#d5a14a" stroke-width="4"/>
    <text x="258" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Too close</text>
    <circle cx="50" cy="242" r="42" fill="#fff0f2" stroke="#de7d98" stroke-width="4"/>
    <text x="50" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Side angle</text>
    <circle cx="274" cy="242" r="42" fill="#fff0f2" stroke="#de7d98" stroke-width="4"/>
    <text x="274" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Side angle</text>
    <text x="26" y="296" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Keep the phone roughly 60 to 80 cm away.</text>
  </g>
  <g transform="translate(470 180)">
    <rect x="0" y="0" width="330" height="332" rx="20" fill="#fff" stroke="#e1e8f4"/>
    <text x="26" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#203047">Side view</text>
    <ellipse cx="162" cy="192" rx="62" ry="82" fill="#fff8fc" stroke="#203047" stroke-width="4"/>
    <circle cx="196" cy="178" r="6" fill="#203047"/>
    <path d="M206 190c14 6 14 18 0 24" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M172 236c18 8 34 8 52 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="116" cy="110" r="26" fill="#e8f7ff" stroke="#6db7d6" stroke-width="4"/>
    <text x="116" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Best</text>
    <line x1="128" y1="124" x2="156" y2="144" stroke="#6db7d6" stroke-width="4"/>
    <circle cx="82" cy="220" r="26" fill="#fff0f2" stroke="#de7d98" stroke-width="4"/>
    <text x="82" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">Low</text>
    <line x1="96" y1="214" x2="132" y2="206" stroke="#de7d98" stroke-width="4"/>
    <circle cx="146" cy="56" r="26" fill="#fff4df" stroke="#d5a14a" stroke-width="4"/>
    <text x="146" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#203047">High</text>
    <line x1="152" y1="80" x2="162" y2="112" stroke="#d5a14a" stroke-width="4"/>
    <text x="26" y="296" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Slightly above eye level helps the jaw read cleanly without exaggerating the forehead.</text>
  </g>
</svg>
