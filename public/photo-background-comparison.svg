<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Background comparison table</title>
  <desc id="desc">Original SVG table comparing plain wall, window light wall, foliage, street scene, patterned wall, and multiple faces for AI face detection reliability.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">背景と検出の信頼性</text>
    <text x="72" y="126" font-size="18" fill="#64748b">コントラストが明瞭だと、検出器がすばやく1つの顔を捉えられます。</text>
  </g>
  <g transform="translate(72 170)" font-family="Arial, sans-serif" font-size="17">
    <rect width="756" height="320" rx="18" fill="#fff" stroke="#e1e8f4"/>
    <rect width="756" height="52" rx="18" fill="#fff8fc"/>
    <text x="20" y="33" font-weight="700" fill="#203047">背景の種類</text>
    <text x="280" y="33" font-weight="700" fill="#203047">検出の信頼性</text>
    <text x="456" y="33" font-weight="700" fill="#203047">良い・悪い理由</text>
    <line x1="0" y1="52" x2="756" y2="52" stroke="#e1e8f4"/>
    <g fill="#203047">
      <text x="20" y="90">無地の明るい壁</text><text x="280" y="90" fill="#2e7d32">高</text><text x="456" y="90" fill="#64748b">顔と背景の境界が明瞭で、競合する形がない</text>
      <line x1="0" y1="108" x2="756" y2="108" stroke="#e1e8f4"/>
      <text x="20" y="146">窓際のシンプルな室内</text><text x="280" y="146" fill="#2e7d32">高</text><text x="456" y="146" fill="#64748b">窓が背後になければ、光もコントラストも良好</text>
      <line x1="0" y1="164" x2="756" y2="164" stroke="#e1e8f4"/>
      <text x="20" y="202">屋外の緑・植栽</text><text x="280" y="202" fill="#8a6d1f">中</text><text x="456" y="202" fill="#64748b">背景がぼけて動かなければ概ね問題なし</text>
      <line x1="0" y1="220" x2="756" y2="220" stroke="#e1e8f4"/>
      <text x="20" y="258">人通りの多い街中</text><text x="280" y="258" fill="#c62828">低</text><text x="456" y="258" fill="#64748b">多くの輪郭・顔・光・動きが信頼度を下げる</text>
      <line x1="0" y1="276" x2="756" y2="276" stroke="#e1e8f4"/>
      <text x="20" y="314">柄物の壁紙</text><text x="280" y="314" fill="#c62828">低</text><text x="456" y="314" fill="#64748b">強い柄は顔の輪郭と競合することがある</text>
      <line x1="0" y1="332" x2="756" y2="332" stroke="#e1e8f4"/>
      <text x="20" y="370">他の顔が写り込む</text><text x="280" y="370" fill="#c62828">非常に低い</text><text x="456" y="370" fill="#64748b">複数顔の検出で別人を対象にしたり精度が分散したりする</text>
    </g>
  </g>
  <text x="72" y="538" font-family="Arial, sans-serif" font-size="17" fill="#64748b">色白の肌と白い壁の組み合わせでは、純白よりも淡いグレーや薄いブルーの背景の方が輪郭が明瞭になります。</text>
</svg>
