<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Background comparison table</title>
  <desc id="desc">Original SVG table comparing plain wall, window light wall, foliage, street scene, patterned wall, and multiple faces for AI face detection reliability.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">Background and detection reliability</text>
    <text x="72" y="126" font-size="18" fill="#64748b">Cleaner contrast helps the detector lock onto one face quickly.</text>
  </g>
  <g transform="translate(72 170)" font-family="Arial, sans-serif" font-size="17">
    <rect width="756" height="320" rx="18" fill="#fff" stroke="#e1e8f4"/>
    <rect width="756" height="52" rx="18" fill="#fff8fc"/>
    <text x="20" y="33" font-weight="700" fill="#203047">Background type</text>
    <text x="280" y="33" font-weight="700" fill="#203047">Detection reliability</text>
    <text x="456" y="33" font-weight="700" fill="#203047">Why it helps or hurts</text>
    <line x1="0" y1="52" x2="756" y2="52" stroke="#e1e8f4"/>
    <g fill="#203047">
      <text x="20" y="90">Plain light wall</text><text x="280" y="90" fill="#2e7d32">High</text><text x="456" y="90" fill="#64748b">Clear face-background edge and no competing shapes</text>
      <line x1="0" y1="108" x2="756" y2="108" stroke="#e1e8f4"/>
      <text x="20" y="146">Window-side neutral room</text><text x="280" y="146" fill="#2e7d32">High</text><text x="456" y="146" fill="#64748b">Good light and soft contrast if the window is not behind you</text>
      <line x1="0" y1="164" x2="756" y2="164" stroke="#e1e8f4"/>
      <text x="20" y="202">Outdoor foliage</text><text x="280" y="202" fill="#8a6d1f">Medium</text><text x="456" y="202" fill="#64748b">Usually fine if the background stays blurred and still</text>
      <line x1="0" y1="220" x2="756" y2="220" stroke="#e1e8f4"/>
      <text x="20" y="258">Busy street scene</text><text x="280" y="258" fill="#c62828">Low</text><text x="456" y="258" fill="#64748b">Many edges, faces, lights, and motion lower confidence</text>
      <line x1="0" y1="276" x2="756" y2="276" stroke="#e1e8f4"/>
      <text x="20" y="314">Patterned wallpaper</text><text x="280" y="314" fill="#c62828">Low</text><text x="456" y="314" fill="#64748b">Strong patterns can compete with the face outline</text>
      <line x1="0" y1="332" x2="756" y2="332" stroke="#e1e8f4"/>
      <text x="20" y="370">Other faces in frame</text><text x="280" y="370" fill="#c62828">Very low</text><text x="456" y="370" fill="#64748b">Multi-face detection can target the wrong person or split attention</text>
    </g>
  </g>
  <text x="72" y="538" font-family="Arial, sans-serif" font-size="17" fill="#64748b">For very light skin against a white wall, a soft gray or pale blue background often gives a cleaner edge than pure white.</text>
</svg>
