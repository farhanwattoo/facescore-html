<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Feature impact weighting bar chart</title>
  <desc id="desc">Original SVG bar chart summarizing estimated impact of eye shape, face shape, symmetry, nose, lips, jawline, and brows on face scoring.</desc>
  <rect width="840" height="520" fill="#f8fbff"/>
  <rect x="24" y="24" width="792" height="472" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="84" font-size="32" font-weight="700" fill="#203047">顔パーツ別の影響度（参考値）</text>
    <text x="72" y="116" font-size="17" fill="#64748b">この範囲は教育用モデルの一例であり、すべてのAIに共通する絶対的なルールではありません。</text>
  </g>
  <g transform="translate(72 158)" font-family="Arial, sans-serif">
    <g>
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">目と間隔</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="352" height="20" rx="10" fill="#ff6ca7"/>
      <text x="698" y="18" font-size="18" fill="#203047">25%</text>
    </g>
    <g transform="translate(0 48)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">顔の形と大きさ</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="282" height="20" rx="10" fill="#ff86b6"/>
      <text x="698" y="18" font-size="18" fill="#203047">20%</text>
    </g>
    <g transform="translate(0 96)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">左右対称性と全体バランス</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="282" height="20" rx="10" fill="#ff96c0"/>
      <text x="698" y="18" font-size="18" fill="#203047">20%</text>
    </g>
    <g transform="translate(0 144)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">鼻の比率</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="212" height="20" rx="10" fill="#ffadc9"/>
      <text x="698" y="18" font-size="18" fill="#203047">15%</text>
    </g>
    <g transform="translate(0 192)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">口と唇</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="141" height="20" rx="10" fill="#ffbed4"/>
      <text x="698" y="18" font-size="18" fill="#203047">10%</text>
    </g>
    <g transform="translate(0 240)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">フェイスラインと顎</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="99" height="20" rx="10" fill="#ffd1e2"/>
      <text x="698" y="18" font-size="18" fill="#203047">7%</text>
    </g>
    <g transform="translate(0 288)">
      <text x="0" y="18" font-size="18" font-weight="700" fill="#203047">眉</text>
      <rect x="210" y="2" width="470" height="20" rx="10" fill="#e8eef8"/>
      <rect x="210" y="2" width="42" height="20" rx="10" fill="#ffe0ea"/>
      <text x="698" y="18" font-size="18" fill="#203047">3%</text>
    </g>
  </g>
  <text x="72" y="458" font-family="Arial, sans-serif" font-size="17" fill="#64748b">重み付けはモデルのバージョンによって変わります。個人の価値の順位ではなく、解釈の目安としてお読みください。</text>
</svg>
