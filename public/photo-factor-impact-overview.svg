<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Photo factors affecting face score</title>
  <desc id="desc">Original SVG overview of six photo quality factors and estimated impact on AI face score accuracy.</desc>
  <rect width="900" height="620" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="572" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">スコアを最も左右する6つの撮影要因</text>
    <text x="72" y="126" font-size="18" fill="#64748b">推定範囲です。入力写真が良いほどAIは正確に読み取れます。</text>
  </g>
  <g transform="translate(72 170)" font-family="Arial, sans-serif">
    <g>
      <rect width="356" height="110" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">ライティング（光）</text>
      <text x="24" y="68" font-size="16" fill="#64748b">均一な正面光がランドマーク信頼度を最も高める</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="208" height="14" rx="7" fill="#ff6ca7"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">~30%</text>
    </g>
    <g transform="translate(372 0)">
      <rect width="356" height="110" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">カメラアングル（角度）</text>
      <text x="24" y="68" font-size="16" fill="#64748b">正面アングルと十分な距離が歪みを減らす</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="176" height="14" rx="7" fill="#ff86b6"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">~25%</text>
    </g>
    <g transform="translate(0 138)">
      <rect width="356" height="110" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">表情</text>
      <text x="24" y="68" font-size="16" fill="#64748b">自然な笑顔は印象と笑顔スコアの両方を変える</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="144" height="14" rx="7" fill="#ff96c0"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">~20%</text>
    </g>
    <g transform="translate(372 138)">
      <rect width="356" height="110" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">背景</text>
      <text x="24" y="68" font-size="16" fill="#64748b">明瞭なコントラストが1つの顔の検出を助ける</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="72" height="14" rx="7" fill="#ffadc9"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">~10%</text>
    </g>
    <g transform="translate(0 276)">
      <rect width="356" height="110" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">画質</text>
      <text x="24" y="68" font-size="16" fill="#64748b">解像度とシャープさが細かいランドマーク配置に影響</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="72" height="14" rx="7" fill="#ffbed4"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">~10%</text>
    </g>
    <g transform="translate(372 276)">
      <rect width="356" height="110" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <text x="24" y="40" font-size="22" font-weight="700" fill="#203047">フィルター（加工）</text>
      <text x="24" y="68" font-size="16" fill="#64748b">軽い補正は読み取りを助けるが、輪郭加工は精度を壊す</text>
      <rect x="24" y="80" width="260" height="14" rx="7" fill="#e8eef8"/>
      <rect x="24" y="80" width="110" height="14" rx="7" fill="#ffd1e2"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8c2f5a">変動</text>
    </g>
  </g>
  <text x="72" y="568" font-family="Arial, sans-serif" font-size="17" fill="#64748b">数値は編集部の推定です。モデルのバージョン・カメラ処理・照明条件で範囲は変わります。</text>
</svg>
