<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Nose ratio diagram</title>
  <desc id="desc">Original SVG illustrating nose width, inner eye distance, bridge height, and nostril flare points.</desc>
  <rect width="720" height="520" fill="#f8fbff"/>
  <rect x="24" y="24" width="672" height="472" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g transform="translate(110 70)">
    <ellipse cx="170" cy="170" rx="130" ry="160" fill="#fff8fc" stroke="#203047" stroke-width="5"/>
    <path d="M92 136c18-16 44-16 60 0" fill="none" stroke="#203047" stroke-width="4"/>
    <path d="M190 136c18-16 44-16 60 0" fill="none" stroke="#203047" stroke-width="4"/>
    <path d="M90 172c18-10 44-10 62 0c-18 14-44 14-62 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
    <path d="M188 172c18-10 44-10 62 0c-18 14-44 14-62 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
    <path d="M170 146c10 24 10 56 0 92" fill="none" stroke="#203047" stroke-width="5" stroke-linecap="round"/>
    <path d="M132 242c24 10 52 10 76 0" fill="none" stroke="#203047" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="172" x2="220" y2="172" stroke="#ff6ca7" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="132" y1="242" x2="208" y2="242" stroke="#8c2f5a" stroke-width="4"/>
    <line x1="170" y1="90" x2="170" y2="242" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 8"/>
    <circle cx="132" cy="242" r="6" fill="#ff6ca7"/>
    <circle cx="208" cy="242" r="6" fill="#ff6ca7"/>
    <circle cx="170" cy="242" r="6" fill="#8c2f5a"/>
  </g>
  <g transform="translate(410 94)" font-family="Arial, sans-serif">
    <rect width="210" height="92" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="34" font-size="20" font-weight="700" fill="#203047">目頭間の距離</text>
    <text x="18" y="62" font-size="15" fill="#64748b">鼻の幅としばしば比較される</text>
    <rect y="110" width="210" height="92" rx="16" fill="#fff" stroke="#e1e8f4"/>
    <text x="18" y="144" font-size="20" font-weight="700" fill="#203047">鼻筋の高さ</text>
    <text x="18" y="172" font-size="15" fill="#64748b">鼻根から鼻先への高さ</text>
    <rect y="220" width="210" height="92" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="254" font-size="20" font-weight="700" fill="#203047">小鼻の広がり</text>
    <text x="18" y="282" font-size="15" fill="#64748b">付け根の幅と外側のカーブ</text>
  </g>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="18" fill="#64748b">AIは鼻の幅を付け根のランドマークから読み取り、目の間隔や顔の幅と比較します。</text>
</svg>
