<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Face width-height ratio diagram</title>
  <desc id="desc">Original SVG showing how face width and face height are measured using cheekbone and chin-to-hairline landmarks.</desc>
  <rect width="720" height="520" fill="#f8fbff"/>
  <rect x="24" y="24" width="672" height="472" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g transform="translate(120 74)">
    <ellipse cx="190" cy="170" rx="150" ry="188" fill="#fff8fc" stroke="#203047" stroke-width="5"/>
    <line x1="40" y1="170" x2="340" y2="170" stroke="#ff6ca7" stroke-width="5"/>
    <line x1="190" y1="-18" x2="190" y2="358" stroke="#8c2f5a" stroke-width="5"/>
    <path d="M126 140c18-16 44-16 60 0" fill="none" stroke="#203047" stroke-width="4"/>
    <path d="M194 140c18-16 44-16 60 0" fill="none" stroke="#203047" stroke-width="4"/>
    <path d="M124 176c18-10 44-10 62 0c-18 14-44 14-62 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
    <path d="M194 176c18-10 44-10 62 0c-18 14-44 14-62 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
    <path d="M190 154c10 20 10 48 0 80" fill="none" stroke="#203047" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 252c20 10 44 14 68 14s48-4 68-14" fill="none" stroke="#203047" stroke-width="4" stroke-linecap="round"/>
    <text x="190" y="-34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8c2f5a">Face height</text>
    <text x="190" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ff6ca7">Face width</text>
  </g>
  <g transform="translate(426 116)" font-family="Arial, sans-serif">
    <rect width="196" height="92" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="34" font-size="20" font-weight="700" fill="#203047">Width line</text>
    <text x="18" y="60" font-size="15" fill="#64748b">Usually around the cheekbone zone</text>
    <rect y="114" width="196" height="92" rx="16" fill="#fff" stroke="#e1e8f4"/>
    <text x="18" y="148" font-size="20" font-weight="700" fill="#203047">Height line</text>
    <text x="18" y="174" font-size="15" fill="#64748b">Hairline or upper forehead to chin</text>
    <rect y="228" width="196" height="92" rx="16" fill="#fff8fc" stroke="#e1e8f4"/>
    <text x="18" y="262" font-size="20" font-weight="700" fill="#203047">Ratio output</text>
    <text x="18" y="288" font-size="15" fill="#64748b">Used with jaw angle and thirds, not alone</text>
  </g>
</svg>
