<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Eye shape chart with 8 categories</title>
  <desc id="desc">Original SVG chart illustrating eight eye shape types and a spacing rule used in face analysis.</desc>
  <rect width="960" height="720" fill="#f8fbff"/>
  <rect x="24" y="24" width="912" height="672" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">Eye shape types and spacing rule</text>
    <text x="72" y="126" font-size="18" fill="#64748b">Reference chart: shape names are descriptive, not ranked.</text>
  </g>
  <g transform="translate(72 164)" font-family="Arial, sans-serif">
    <g transform="translate(0 0)">
      <rect width="190" height="180" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <path d="M34 96c30-28 92-28 122 0c-30 28-92 28-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <path d="M34 84c30-18 92-18 122 0" fill="none" stroke="#ff6ca7" stroke-width="4"/>
      <circle cx="95" cy="96" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Double eyelid</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Visible crease above lash line</text>
    </g>
    <g transform="translate(208 0)">
      <rect width="190" height="180" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <path d="M34 96c30-22 92-22 122 0c-30 22-92 22-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <circle cx="95" cy="96" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Single eyelid</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Flatter upper lid profile</text>
    </g>
    <g transform="translate(416 0)">
      <rect width="190" height="180" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <path d="M34 96c30-24 92-24 122 0c-30 24-92 24-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <path d="M46 84c24-10 74-10 98 0" fill="none" stroke="#ff6ca7" stroke-width="3" opacity=".75"/>
      <circle cx="95" cy="96" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Inner crease</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Crease partly hidden by lid</text>
    </g>
    <g transform="translate(624 0)">
      <rect width="190" height="180" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <path d="M34 106c30-18 92-30 122-10c-30 34-92 34-122 10Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <circle cx="97" cy="102" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Downturned</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Outer corner sits slightly lower</text>
    </g>
    <g transform="translate(0 222)">
      <rect width="190" height="180" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <path d="M34 92c30-12 92-28 122-2c-30 36-92 28-122 2Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <circle cx="98" cy="90" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Upturned</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Outer corner sits slightly higher</text>
    </g>
    <g transform="translate(208 222)">
      <rect width="190" height="180" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <path d="M34 96c24-32 98-32 122 0c-24 32-98 32-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <circle cx="95" cy="96" r="14" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Round</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Taller opening and softer corners</text>
    </g>
    <g transform="translate(416 222)">
      <rect width="190" height="180" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <path d="M34 96c36-16 90-16 122 0c-36 16-90 16-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <circle cx="95" cy="96" r="11" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Narrow</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Lower vertical opening</text>
    </g>
    <g transform="translate(624 222)">
      <rect width="190" height="180" rx="20" fill="#fff8fc" stroke="#e1e8f4"/>
      <path d="M34 96c32-22 92-22 122 0c-32 22-92 22-122 0Z" fill="#fff" stroke="#203047" stroke-width="4"/>
      <path d="M44 96l20-18m72 36l20-18" stroke="#203047" stroke-width="3" fill="none" opacity=".35"/>
      <circle cx="95" cy="96" r="12" fill="#203047"/>
      <text x="18" y="150" font-size="18" font-weight="700" fill="#203047">Almond</text>
      <text x="18" y="170" font-size="14" fill="#64748b">Balanced taper at both corners</text>
    </g>
  </g>
  <g transform="translate(72 612)" font-family="Arial, sans-serif">
    <text x="0" y="0" font-size="18" fill="#64748b">Spacing rule used in many guides: inter-eye distance ≈ one eye width.</text>
    <line x1="0" y1="28" x2="120" y2="28" stroke="#203047" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="28" x2="270" y2="28" stroke="#203047" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="28" x2="150" y2="28" stroke="#ff6ca7" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="58" font-size="16" fill="#203047">Eye width</text>
    <text x="126" y="58" font-size="16" fill="#8c2f5a">Inter-eye gap</text>
    <text x="214" y="58" font-size="16" fill="#203047">Eye width</text>
  </g>
</svg>
