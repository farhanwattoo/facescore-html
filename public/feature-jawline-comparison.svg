<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Jawline comparison illustration</title>
  <desc id="desc">Original SVG showing V-line, U-line, and square jawline comparisons in a neutral descriptive format.</desc>
  <rect width="840" height="420" fill="#f8fbff"/>
  <rect x="24" y="24" width="792" height="372" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="86" font-size="32" font-weight="700">フェイスライン比較</text>
    <text x="72" y="116" font-size="17" fill="#64748b">顎の角度・顎先の突出・顔型分類に使われます。</text>
  </g>
  <g transform="translate(108 156)" stroke="#203047" stroke-width="5" fill="none" font-family="Arial, sans-serif">
    <g transform="translate(0 0)">
      <path d="M60 0c36 0 54 24 54 58v22c0 36-10 60-54 100C16 140 6 116 6 80V58C6 24 24 0 60 0Z"/>
      <text x="18" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">Vライン</text>
      <text x="18" y="238" fill="#64748b" font-size="14" stroke="none">顎先がシャープに細くなる</text>
    </g>
    <g transform="translate(236 0)">
      <path d="M60 0c36 0 54 24 54 58v24c0 48-24 74-54 92C30 156 6 130 6 82V58C6 24 24 0 60 0Z"/>
      <text x="18" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">Uライン</text>
      <text x="18" y="238" fill="#64748b" font-size="14" stroke="none">顎先がやわらかいカーブ</text>
    </g>
    <g transform="translate(472 0)">
      <path d="M18 18h84c18 0 30 18 30 40v60c0 44-30 62-72 62S-12 162-12 118V58c0-22 12-40 30-40Z"/>
      <text x="8" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">エラ張り</text>
      <text x="8" y="238" fill="#64748b" font-size="14" stroke="none">エラの角度が直線的</text>
    </g>
  </g>
  <text x="72" y="360" font-family="Arial, sans-serif" font-size="17" fill="#64748b">AIは顎の幅・エラの角度・顎先の位置・頬から顎への絞り込み方からこれらのパターンを読み取ります。</text>
</svg>
