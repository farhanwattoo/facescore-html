<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Jawline comparison illustration</title>
  <desc id="desc">Original SVG showing V-line, U-line, and square jawline comparisons in a neutral descriptive format.</desc>
  <rect width="840" height="420" fill="#f8fbff"/>
  <rect x="24" y="24" width="792" height="372" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="86" font-size="32" font-weight="700">Jawline comparison</text>
    <text x="72" y="116" font-size="17" fill="#64748b">Used for jaw angle, chin projection, and shape classification.</text>
  </g>
  <g transform="translate(108 156)" stroke="#203047" stroke-width="5" fill="none" font-family="Arial, sans-serif">
    <g transform="translate(0 0)">
      <path d="M60 0c36 0 54 24 54 58v22c0 36-10 60-54 100C16 140 6 116 6 80V58C6 24 24 0 60 0Z"/>
      <text x="18" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">V-line</text>
      <text x="18" y="238" fill="#64748b" font-size="14" stroke="none">Sharper chin taper</text>
    </g>
    <g transform="translate(236 0)">
      <path d="M60 0c36 0 54 24 54 58v24c0 48-24 74-54 92C30 156 6 130 6 82V58C6 24 24 0 60 0Z"/>
      <text x="18" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">U-line</text>
      <text x="18" y="238" fill="#64748b" font-size="14" stroke="none">Softer curve through chin</text>
    </g>
    <g transform="translate(472 0)">
      <path d="M18 18h84c18 0 30 18 30 40v60c0 44-30 62-72 62S-12 162-12 118V58c0-22 12-40 30-40Z"/>
      <text x="8" y="216" fill="#203047" font-size="18" stroke="none" font-weight="700">Square jaw</text>
      <text x="8" y="238" fill="#64748b" font-size="14" stroke="none">Straighter corner angle</text>
    </g>
  </g>
  <text x="72" y="360" font-family="Arial, sans-serif" font-size="17" fill="#64748b">The AI reads these patterns from jaw width, gonial angle, chin point, and how quickly the cheek narrows into the chin.</text>
</svg>
