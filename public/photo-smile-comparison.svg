<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Smile comparison guide</title>
  <desc id="desc">Original SVG comparing neutral face, natural Duchenne smile, and forced smile for face analysis photos.</desc>
  <rect width="900" height="560" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="512" rx="28" fill="#fff" stroke="#d9e5f4" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203047">
    <text x="72" y="92" font-size="34" font-weight="700">Smile types and score behavior</text>
    <text x="72" y="126" font-size="18" fill="#64748b">A relaxed closed-mouth smile usually balances expression and landmark clarity best.</text>
  </g>
  <g transform="translate(72 172)" font-family="Arial, sans-serif">
    <g>
      <rect width="220" height="252" rx="20" fill="#fff" stroke="#e1e8f4"/>
      <ellipse cx="110" cy="118" rx="62" ry="82" fill="#fff8fc" stroke="#203047" stroke-width="4"/>
      <path d="M82 98c8-8 20-8 28 0M110 98c8-8 20-8 28 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M98 162c10 -2 24 -2 34 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="700">Neutral</text>
      <text x="110" y="232" text-anchor="middle" font-size="14" fill="#64748b">Stable landmarks, lower smile score</text>
    </g>
    <g transform="translate(268 0)">
      <rect width="220" height="252" rx="20" fill="#f8fff9" stroke="#d8eadf"/>
      <ellipse cx="110" cy="118" rx="62" ry="82" fill="#fff8fc" stroke="#203047" stroke-width="4"/>
      <path d="M82 98c8-8 20-8 28 0M110 98c8-8 20-8 28 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M92 160c18 16 40 16 58 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M78 102c2 14 10 24 20 30M140 102c-2 14-10 24-20 30" stroke="#ff6ca7" stroke-width="3" fill="none" opacity=".8"/>
      <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="700">Natural smile</text>
      <text x="110" y="232" text-anchor="middle" font-size="14" fill="#2e7d32">Best balance of warmth and clarity</text>
    </g>
    <g transform="translate(536 0)">
      <rect width="220" height="252" rx="20" fill="#fffdf8" stroke="#ebe4d7"/>
      <ellipse cx="110" cy="118" rx="62" ry="82" fill="#fff8fc" stroke="#203047" stroke-width="4"/>
      <path d="M82 100c10-4 20-4 28 0M110 100c10-4 20-4 28 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M90 160c18 4 40 4 60 0" stroke="#203047" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="700">Forced smile</text>
      <text x="110" y="232" text-anchor="middle" font-size="14" fill="#8a6d1f">Looks tense, often narrows the eyes too much</text>
    </g>
  </g>
  <text x="72" y="476" font-family="Arial, sans-serif" font-size="17" fill="#64748b">If teeth exposure hides the lip line or your eyes squeeze shut, a softer closed-mouth smile is usually more consistent for retests.</text>
</svg>
